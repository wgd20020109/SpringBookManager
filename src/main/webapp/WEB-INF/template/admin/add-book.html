<!DOCTYPE html>
<!--[if IE 8]>
<html lang="en" class="ie8 no-js"> <![endif]-->
<!--[if IE 9]>
<html lang="en" class="ie9 no-js"> <![endif]-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>添加书籍</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta name="description" content="">
  <meta name="keywords" content="">
  <meta name="author" content="">
  <meta name="MobileOptimized" content="320">
  <!--Start Style -->
  <link rel="icon" th:href="@{/static/image/img.png}" type="image/x-icon">
  <link rel="stylesheet" type="text/css" th:href="@{/static/css/fonts.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/static/css/bootstrap.min.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/static/css/font-awesome.min.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/static/css/icofont.min.css}">
  <link rel="stylesheet" type="text/css" th:href="@{/static/css/style.css}">
</head>
<body>
<div class="loader">
  <div class="spinner">
    <img th:src="@{/static/picture/loader.gif}" alt="">
  </div>
</div>
<!-- Main Body -->
<div class="page-wrapper">
  <!-- Header Start -->
  <div th:replace="headerTemplate.html::title"></div>
  <div th:replace="headerTemplate.html::aside"></div>
  <!-- Container Start -->
  <div class="page-wrapper">
    <div class="main-content">

      <!-- From Start -->
      <div class="from-wrapper">
        <div class="row">
          <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
            <div class="card">
              <div class="card-header">
                <h4 class="from-title mb-1">添加书籍</h4>
                <p class="card-desc">请在下方输入所添加书籍的信息.</p>
              </div>
              <div class="card-body">
                <form class="separate-form" method="post" th:action="@{/api/admin/add-book}">
                  <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">

                    <div class="row">
                      <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
                        <div class="form-group">
                          <label for="member-name" class="col-form-label">书籍标题</label>
                          <input class="form-control" type="text"
                                 placeholder="标题" id="member-name" name="title" required="required">
                        </div>
                      </div>

                      <div class="col-xl-6 col-lg-6 col-md-12 col-sm-12 col-12">
                        <div class="form-group">
                          <label for="company-name" class="col-form-label">书籍价格</label>
                          <input class="form-control" type="text" placeholder="价格"
                                 id="company-name" name="price" required="required">
                        </div>
                      </div>
                      <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                        <div class="form-group">
                          <label for="additional-msg" class="col-form-label">书籍简介</label>
                          <textarea class="form-control" placeholder="简介" id="additional-msg" name="desc"></textarea>
                        </div>
                      </div>

                    </div>
                    <br/>
                    <p style="color: #e4606d;margin-left: 3%;"></p>
                    <div class="form-group mb-0">
                      <button class="btn btn-danger" type="reset">重置</button>
                      <input class="btn btn-primary" required="required" type="submit"
                             value="提交">
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>


        </div>

      </div>


      <div class="ad-footer-btm">
        <p>Copyright &copy; 2023.Oreo All rights reserved.<a target="_blank" th:href="@{/error}">Ciallo～(∠・ω<
          )⌒★</a>
        </p>
      </div>
    </div>
  </div>
</div>
<!-- Script Start -->
<script th:src="@{/static/js/jquery.min.js}"></script>
<script th:src="@{/static/js/popper.min.js}"></script>
<script th:src="@{/static/js/bootstrap.min.js}"></script>
<script th:src="@{/static/js/swiper.min.js}"></script>
<script th:src="@{/static/js/apexcharts.min.js}"></script>
<script th:src="@{/static/js/control-chart-apexcharts.js}"></script>
<!-- Page Specific -->
<script th:src="@{/static/js/nice-select.min.js}"></script>
<!-- Custom Script -->
<script th:src="@{/static/js/custom.js}"></script>
</body>
</html>
