<!DOCTYPE html>
<!--[if IE 8]>
<html lang="en" class="ie8 no-js"> <![endif]-->
<!--[if IE 9]>
<html lang="en" class="ie9 no-js"> <![endif]-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>图书管理 - 图书管理系统</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="author" content="">
    <meta name="MobileOptimized" content="320">
    <!--Start Style -->
    <link rel="icon" th:href="@{/static/image/img.png}" type="image/x-icon">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/fonts.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/font-awesome.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/icofont.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/style.css}">
</head>
<body>
<div class="loader">
    <div class="spinner">
        <img th:src="@{/static/picture/loader.gif}" alt="">
    </div>
</div>
<!-- Main Body -->
<div class="page-wrapper">
    <!-- Header Start -->
    <div th:replace="headerTemplate.html::title"></div>
    <div th:replace="headerTemplate.html::aside"></div>
    <!-- Container Start -->
    <div class="page-wrapper">
        <div class="main-content">
            <!-- Page Title Start -->
            <div class="row">
                <div class="colxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                    <div class="page-title-wrapper">
                        <div class="page-title-box ad-title-box-use">
                            <h4 class="page-title">图书管理</h4>
                        </div>
                        <div class="ad-breadcrumb">
                            <ul>
                                <li>
                                    <div class="ad-user-btn">
                                        <input class="form-control" type="text" placeholder="输入标题关键字..."
                                               id="text-input" onkeyup="onSearch(this.value,1)">
                                        <svg version="1.1" xmlns="http://www.w3.org/2000/svg"
                                             viewBox="0 0 56.966 56.966">
                                            <path d="M55.146,51.887L41.588,37.786c3.486-4.144,5.396-9.358,5.396-14.786c0-12.682-10.318-23-23-23s-23,10.318-23,23
												s10.318,23,23,23c4.761,0,9.298-1.436,13.177-4.162l13.661,14.208c0.571,0.593,1.339,0.92,2.162,0.92
												c0.779,0,1.518-0.297,2.079-0.837C56.255,54.982,56.293,53.08,55.146,51.887z M23.984,6c9.374,0,17,7.626,17,17s-7.626,17-17,17
												s-17-7.626-17-17S14.61,6,23.984,6z"></path>
                                        </svg>
                                    </div>
                                </li>
                                <li>
                                    <div class="add-group">
                                        <a class="ad-btn" th:href="@{/page/admin/add-book}">添加书籍</a>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Table Start -->
            <div class="row">
                <!-- Styled Table Card-->
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                    <div class="card table-card">
                        <div class="card-header pb-0">
                            <h4>图书列表</h4>
                        </div>
                        <div class="card-body">
                            <div class="chart-holder">
                                <div class="table-responsive">
                                    <table class="table table-styled mb-0" id="book-table">
                                        <thead>
                                        <tr>
                                            <th># ID</th>
                                            <th>标题</th>
                                            <th>简介</th>
                                            <th>价格</th>
                                            <th>借阅状态</th>
                                            <th>其他</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="books : ${bookList}">
                                            <td th:text="'# '+${books.getBid()}"># 1</td>
                                            <td th:text="${books.getTitle()}">书名</td>
                                            <td th:text="${books.getDesc()}">
                                                图书描述信息
                                            </td>
                                            <td>
                                                <label class="mb-0 badge badge-primary" th:text="'￥ '+${books.getPrice()}">￥ 2.33</label>
                                            </td>
                                            <td>
                                                <label class="mb-0 badge badge-danger" title=""
                                                       data-original-title="Pending"
                                                       th:if="${books.getStatus().equals('已借出')}">已借出</label>
                                                <label class="mb-0 badge badge-success" title=""
                                                       data-original-title="Pending"
                                                       th:if="${books.getStatus().equals('可借阅')}">可借阅</label>
                                            </td>

                                            <td class="relative">
                                                <a class="action-btn " href="javascript:void(0); " >
                                                    <svg class="default-size " viewBox="0 0 341.333 341.333 ">
                                                        <g>
                                                            <g>
                                                                <g>
                                                                    <path d="M170.667,85.333c23.573,0,42.667-19.093,42.667-42.667C213.333,19.093,194.24,0,170.667,0S128,19.093,128,42.667 C128,66.24,147.093,85.333,170.667,85.333z "></path>
                                                                    <path d="M170.667,128C147.093,128,128,147.093,128,170.667s19.093,42.667,42.667,42.667s42.667-19.093,42.667-42.667 S194.24,128,170.667,128z "></path>
                                                                    <path d="M170.667,256C147.093,256,128,275.093,128,298.667c0,23.573,19.093,42.667,42.667,42.667s42.667-19.093,42.667-42.667 C213.333,275.093,194.24,256,170.667,256z "></path>
                                                                </g>
                                                            </g>
                                                        </g>
                                                    </svg>
                                                </a>
                                                <div class="action-option " th:if="${books.getStatus().equals('可借阅')}" >
                                                    <ul>
                                                        <li>
                                                            <a href="javascript:void(0); "><i
                                                                    class="far fa-edit mr-2 "></i>编辑</a>
                                                        </li>
                                                        <li>
                                                            <a th:href="@{/api/admin/del-book(bid=${books.getBid()})}"><i
                                                                    class="far fa-trash-alt mr-2 "></i> 删除</a>
                                                        </li>
                                                    </ul>
                                                </div>
                                            </td>
                                        </tr>

                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <script type="text/javascript">
                const btb = document.getElementById("book-table");
                //搜索框模糊匹配
                function onSearch(content,col){
                    setTimeout(function (){
                        let rowsLength = btb.rows.length;
                        for (let i = 0; i < rowsLength; i++) {
                            let searchText = btb.rows[i].cells[col].innerHTML;
                            if(searchText.match(content) || searchText.toUpperCase().match(content.toUpperCase())){
                                btb.rows[i].style.display='';//显示行操作，
                            }else{
                                btb.rows[i].style.display='none';//隐藏行操作
                            }
                        }
                    },40);
                }
            </script>

            <div class="ad-footer-btm">
                <p>Copyright &copy; 2023.Oreo All rights reserved.<a target="_blank" th:href="@{/error}">Ciallo～(∠・ω<
                    )⌒★</a>
                </p>
            </div>
        </div>
    </div>
</div>
<!-- Script Start -->
<script th:src="@{/static/js/jquery.min.js}"></script>
<script th:src="@{/static/js/popper.min.js}"></script>
<script th:src="@{/static/js/bootstrap.min.js}"></script>
<script th:src="@{/static/js/swiper.min.js}"></script>
<script th:src="@{/static/js/apexcharts.min.js}"></script>
<script th:src="@{/static/js/control-chart-apexcharts.js}"></script>
<!-- Page Specific -->
<script th:src="@{/static/js/nice-select.min.js}"></script>
<!-- Custom Script -->
<script th:src="@{/static/js/custom.js}"></script>
</body>
</html>
