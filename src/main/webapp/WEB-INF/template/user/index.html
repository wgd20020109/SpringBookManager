<!DOCTYPE html>
<!--[if IE 8]>
<html lang="en" class="ie8 no-js"> <![endif]-->
<!--[if IE 9]>
<html lang="en" class="ie9 no-js"> <![endif]-->
<!--[if !IE]><!-->
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--<![endif]-->
<!-- Begin Head -->

<head>
    <title>图书信息 - 图书管理系统</title>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="author" content="">
    <meta name="MobileOptimized" content="320">
    <!--Start Style -->
    <link rel="icon" th:href="@{/static/image/img.png}" type="image/x-icon">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/fonts.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/bootstrap.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/font-awesome.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/icofont.min.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/static/css/style.css}">
    <link rel="stylesheet" id="theme-change" type="text/css" href="">
</head>

<body>
<div class="loader">
    <div class="spinner">
        <img th:src="@{/static/picture/loader.gif}" alt="">
    </div>
</div>
<!-- Main Body -->
<div class="page-wrapper">
    <!-- Header Start -->
    <div th:replace="headerTemplate.html::title"></div>
    <div th:replace="headerTemplate.html::aside"></div>
    <!-- Container Start -->
    <div class="page-wrapper">
        <div class="main-content">
            <!-- Page Title Start -->
            <div class="row">
                <div class="colxl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                    <div class="page-title-wrapper">
                        <div class="page-title-box ad-title-box-use">
                            <h4 class="page-title">图书信息</h4>
                        </div>
                        <div class="breadcrumb-list">
                            <p class="text-md-right">选择您喜欢的图书进行借阅</p>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Table Start -->
            <div class="row">
                <!-- Styled Table Card-->
                <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 col-12">
                    <div class="card table-card">
                        <div class="card-header pb-0">
                            <h4>图书列表</h4>
                        </div>
                        <div class="card-body">
                            <div class="chart-holder">
                                <div class="table-responsive">
                                    <table class="table table-styled mb-0">
                                        <thead>
                                        <tr>
                                            <th># ID</th>
                                            <th>标题</th>
                                            <th>简介</th>
                                            <th>价格</th>
                                            <th>借阅</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="books : ${bookList}">
                                            <td th:text="'# '+${books.getBid()}"># 1</td>
                                            <td th:text="${books.getTitle()}">书名</td>
                                            <td th:text="${books.getDesc()}">
                                                图书描述信息
                                            </td>
                                            <td>
                                                <label class="mb-0 badge badge-primary" th:text="'￥ '+${books.getPrice()}">￥ 2.33</label>
                                            </td>

                                            <td class="relative">
                                                <a class="action-btn " th:href="@{/api/user/borrow-book(bid=${books.getBid()})}">
                                                    <svg t="1686308675703" class="icon" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg" p-id="9612" width="32" height="32"><path d="M816.5376 877.7728H289.3824a102.4 102.4 0 0 1-102.4-102.4v-133.12a17.6128 17.6128 0 0 1 35.0208 0v133.12a66.9696 66.9696 0 0 0 66.9696 66.9696h527.5648a17.6128 17.6128 0 0 1 0 35.0208z" fill="#0090FF" p-id="9613"></path><path d="M734.6176 81.92h-170.3936v318.2592a9.6256 9.6256 0 0 1-15.7696 8.3968l-103.6288-93.7984a8.8064 8.8064 0 0 0-12.288 0l-100.352 93.184a9.6256 9.6256 0 0 1-15.7696-8.3968V81.92h-47.5136A84.7872 84.7872 0 0 0 184.32 166.5024v506.6752A84.7872 84.7872 0 0 0 268.9024 757.76h465.7152A84.7872 84.7872 0 0 0 819.2 673.1776V166.5024A84.7872 84.7872 0 0 0 734.6176 81.92z" fill="#0090FF" p-id="9614"></path></svg>
                                                </a>
                                            </td>
                                        </tr>

                                        </tbody>
                                    </table>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <div class="ad-footer-btm">
                <p>Copyright &copy; 2023.Oreo All rights reserved.<a target="_blank" th:href="@{/error}">Ciallo～(∠・ω< )⌒★</a></p>
            </div>
        </div>
    </div>
</div>


<!-- Script Start -->
<script th:src="@{/static/js/jquery.min.js}"></script>
<script th:src="@{/static/js/popper.min.js}"></script>
<script th:src="@{/static/js/bootstrap.min.js}"></script>
<script th:src="@{/static/js/swiper.min.js}"></script>
<script th:src="@{/static/js/apexcharts.min.js}"></script>
<script th:src="@{/static/js/control-chart-apexcharts.js}"></script>
<!-- Page Specific -->
<script th:src="@{/static/js/nice-select.min.js}"></script>
<!-- Custom Script -->
<script th:src="@{/static/js/custom.js}"></script>
</body>

</html>
